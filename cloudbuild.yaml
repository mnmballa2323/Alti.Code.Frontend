steps:
  # 1. Install dependencies and build backend
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
    dir: 'alti.code.studio.backend'
    id: 'build-backend'

  # 2. Install dependencies and build frontend
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
    dir: 'alti.code.studio.frontend'
    id: 'install-frontend'

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'alti.code.studio.frontend'
    id: 'build-frontend'
    waitFor: ['install-frontend']

  # 3. Containerize Backend for Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/alti-code-studio-backend', '.']
    dir: 'alti.code.studio.backend'
    id: 'docker-build-backend'

  # 4. Containerize Frontend for Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/alti-code-studio-frontend', '.']
    dir: 'alti.code.studio.frontend'
    id: 'docker-build-frontend'

  # 5. Push Images to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alti-code-studio-backend']
    id: 'docker-push-backend'
    waitFor: ['docker-build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alti-code-studio-frontend']
    id: 'docker-push-frontend'
    waitFor: ['docker-build-frontend']

  # 6. Deploy Backend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'alti-code-studio-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/alti-code-studio-backend'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
    id: 'deploy-backend'
    waitFor: ['docker-push-backend']

  # 7. Deploy Frontend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'alti-code-studio-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/alti-code-studio-frontend'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'deploy-frontend'
    waitFor: ['docker-push-frontend']

substitutions:
  _REGION: 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/alti-code-studio-backend'
  - 'gcr.io/$PROJECT_ID/alti-code-studio-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
