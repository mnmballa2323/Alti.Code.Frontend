# ==============================================================================
# INSO CODE: Google Cloud Build CI/CD Pipeline
# ==============================================================================
#
# This pipeline automates the full build → test → containerize → deploy cycle
# for the backend service. Triggered by pushes to the main branch or via
# manual invocation from the Cloud Build console.
#
# Prerequisites:
#   - Artifact Registry repository exists in ${_REGION}
#   - Cloud Run service account has Secret Manager access
#   - VPC connector is provisioned for private network access
#   - Cloud SQL Auth Proxy is configured for database connections
# ==============================================================================

timeout: '1200s' # 20-minute global timeout to prevent runaway builds

steps:
  # --------------------------------------------------------------------------
  # Step 1: Install dependencies with deterministic lockfile resolution
  # --------------------------------------------------------------------------
  - id: 'install-dependencies'
    name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['ci', '--legacy-peer-deps']
    dir: 'Inso.Code.Backend'
    waitFor: ['-'] # Run immediately, no dependencies

  # --------------------------------------------------------------------------
  # Step 2: Lint — catch syntax and style issues early
  # --------------------------------------------------------------------------
  - id: 'lint-backend'
    name: 'node:20-alpine'
    entrypoint: 'npx'
    args: ['eslint', 'src/', '--max-warnings=0', '--no-error-on-unmatched-pattern']
    dir: 'Inso.Code.Backend'
    waitFor: ['install-dependencies']

  # --------------------------------------------------------------------------
  # Step 3: Run test suite — fail fast on any test failure
  # --------------------------------------------------------------------------
  - id: 'run-tests'
    name: 'node:20-alpine'
    entrypoint: 'npx'
    args: ['vitest', 'run', '--reporter=verbose']
    dir: 'Inso.Code.Backend'
    env:
      - 'NODE_ENV=test'
    waitFor: ['lint-backend']

  # --------------------------------------------------------------------------
  # Step 2b: Build frontend Next.js app
  # --------------------------------------------------------------------------
  - id: 'frontend-install'
    name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['ci', '--legacy-peer-deps']
    dir: 'Inso.Code.Frontend'
    waitFor: ['-']

  - id: 'frontend-build'
    name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'Inso.Code.Frontend'
    env:
      - 'NEXT_PUBLIC_API_URL=https://api.alticode.studio'
      - 'NEXT_PUBLIC_GCP_PROJECT_ID=${PROJECT_ID}'
    waitFor: ['frontend-install']

  - id: 'frontend-docker-build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${SHORT_SHA}'
      - '--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:latest'
      - '--file=Inso.Code.Frontend/Dockerfile'
      - './Inso.Code.Frontend'
    waitFor: ['frontend-build']

  - id: 'frontend-docker-push'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${SHORT_SHA}']
    waitFor: ['frontend-docker-build']

  - id: 'frontend-deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'alti-frontend'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=3000'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--min-instances=1'
      - '--max-instances=50'
      - '--allow-unauthenticated'
    waitFor: ['frontend-docker-push']

  # --------------------------------------------------------------------------
  # Step 3: Build production Docker image with cache and metadata labels
  # --------------------------------------------------------------------------
  - id: 'docker-build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${SHORT_SHA}'
      - '--tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest'
      - '--label=git.commit=${COMMIT_SHA}'
      - '--label=build.id=${BUILD_ID}'
      - '--cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest'
      - '--file=Inso.Code.Backend/Dockerfile'
      - '.'
    waitFor: ['run-tests']

  # --------------------------------------------------------------------------
  # Step 4: Push container image to Artifact Registry
  # --------------------------------------------------------------------------
  - id: 'docker-push-sha'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${SHORT_SHA}']
    waitFor: ['docker-build']

  - id: 'docker-push-latest'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest']
    waitFor: ['docker-build']

  # --------------------------------------------------------------------------
  # Step 4b: Scan container for vulnerabilities (On-Demand Scanning)
  # --------------------------------------------------------------------------
  - id: 'vulnerability-scan'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts docker images scan \
          ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${SHORT_SHA} \
          --format='value(response.scan)' \
          --remote 2>/dev/null || echo "⚠️ Vulnerability scan skipped (API not enabled)"
    waitFor: ['docker-push-sha']

  # --------------------------------------------------------------------------
  # Step 5: Deploy to Cloud Run (managed) with traffic migration
  # --------------------------------------------------------------------------
  - id: 'deploy-cloud-run'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-traffic'           # Deploy without shifting traffic (canary safety)
      - '--tag=build-${SHORT_SHA}'
    waitFor: ['docker-push-sha']

  # --------------------------------------------------------------------------
  # Step 6: Migrate traffic to new revision after successful deployment
  # --------------------------------------------------------------------------
  - id: 'migrate-traffic'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - '${_SERVICE_NAME}'
      - '--to-latest'
      - '--region=${_REGION}'
    waitFor: ['deploy-cloud-run']

# ==============================================================================
# Substitution Variables (overridable at trigger time)
# ==============================================================================
substitutions:
  _REGION: us-central1
  _REPO_NAME: inso-code
  _SERVICE_NAME: alti-backend

# ==============================================================================
# Build Options
# ==============================================================================
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'    # Faster builds with 8 vCPU machine
  substitution_option: 'ALLOW_LOOSE'

# Artifact images pushed during the build
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:latest'
