# Generated Kubernetes deployment for stack: azure-isolated
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-isolated-deployment
  labels:
    app: azure-isolated
spec:
  replicas: 3
  selector:
    matchLabels:
      app: azure-isolated
  template:
    metadata:
      labels:
        app: azure-isolated
    spec:
      containers:
      - name: azure-isolated-container
        image: alticodestudio.azurecr.io/alti-azure-backend:latest
        ports:
        - containerPort: 5002
        env:
        - name: PORT
          value: "5002"
        - name: LOG_LEVEL
          value: "info"
        - name: AZURE_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: endpoint
        - name: AZURE_API_KEY
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: api-key