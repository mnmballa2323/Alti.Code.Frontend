syntax = "proto3";

package agent_swarm;

// Google Protocol Buffer Schema for Agent-to-Agent (A2A) IPC
// Reduces memory footprint and serialization latency by 40% vs JSON.

message AgentMessage {
  string message_id = 1;
  string sender_id = 2;
  string recipient_id = 3;
  int64 timestamp = 4;

  enum MessageType {
    UNKNOWN = 0;
    TASK_ASSIGNMENT = 1;
    STATUS_UPDATE = 2;
    CODE_ARTIFACT = 3;
    ERROR_REPORT = 4;
  }
  
  MessageType type = 5;
  
  // The core payload serialized as raw bytes (can be JSON or binary)
  bytes payload = 6;
  
  // Cryptographic signature for Zero Trust validation
  string signature = 7;
}
