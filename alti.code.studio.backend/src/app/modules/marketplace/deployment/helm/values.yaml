# Alti.Code.Studio Enterprise Swarm Helm Configuration
# Designed for secure VPC deployments via GCP, AWS, and Azure marketplaces.

replicaCount: 3

image:
  repository: gcr.io/alticode-prod/swarm-backend
  pullPolicy: IfNotPresent
  tag: "39.37.92"

imagePullSecrets:
  - name: alticode-marketplace-registry-key

nameOverride: "alticode-backend"
fullnameOverride: "alticode-backend-enterprise"

serviceAccount:
  create: true
  annotations:
    # IAM Roles for Service Accounts (IRSA / Workload Identity)
    iam.gke.io/gcp-service-account: "alticode-marketplace-sa@alticode-prod.iam.gserviceaccount.com"
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/alticode-marketplace-metering-role"
  name: "alticode-marketplace-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: alticode.enterprise.internal
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: alticode-enterprise-tls
      hosts:
        - alticode.enterprise.internal

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Marketplace Billing & Security Environment Configurations
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  
  # Dual-cloud Database Connections
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: alticode-secrets
        key: db-url
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: alticode-secrets
        key: redis-url

  # Marketplace Metering Credentials
  - name: MARKETPLACE_PROVIDER
    value: "gcp" # Options: gcp, aws, azure
  - name: MARKETPLACE_METERING_SECRET
    valueFrom:
      secretKeyRef:
        name: alticode-marketplace-secrets
        key: license-metering-key

# Storage for local cleanrooms and plugin volumes
persistence:
  enabled: true
  storageClass: "premium-rwo"
  size: 50Gi
  mountPath: "/data/cleanroom"
