apiVersion: apps/v1
kind: Deployment
metadata:
  name: alticode-backend-enterprise
  namespace: alticode-platform
  labels:
    app.kubernetes.io/name: alticode-backend
    app.kubernetes.io/instance: alticode-marketplace-saas
    app.kubernetes.io/component: core-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alticode-backend
  template:
    metadata:
      labels:
        app: alticode-backend
    spec:
      serviceAccountName: alticode-marketplace-sa
      securityContext:
        fsGroup: 2000
      containers:
        - name: alticode-api
          image: gcr.io/alticode-prod/swarm-backend:39.37.92
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-api
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: alticode-secrets
                  key: db-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: alticode-secrets
                  key: redis-url
            - name: MARKETPLACE_PROVIDER
              value: "aws" # Set dynamic provider: 'gcp', 'aws', or 'azure'
            - name: MARKETPLACE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: alticode-marketplace-secrets
                  key: metering-api-token
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: cleanroom-storage
              mountPath: /data/cleanroom
            - name: shared-logs
              mountPath: /logs
      volumes:
        - name: cleanroom-storage
          persistentVolumeClaim:
            claimName: alticode-cleanroom-pvc
        - name: shared-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alticode-backend-service
  namespace: alticode-platform
spec:
  selector:
    app: alticode-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
