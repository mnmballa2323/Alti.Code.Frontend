steps:
  # Build the container image for the headless Puppeteer fleet
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/deep-researcher-fleet', '-f', 'Dockerfile.scraper', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/deep-researcher-fleet']

  # Deploy container image to Cloud Run (Headless Fleet)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'deep-researcher-fleet'
      - '--image'
      - 'gcr.io/$PROJECT_ID/deep-researcher-fleet'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated' # Can be secured via IAM if needed
      - '--memory'
      - '2Gi' # Puppeteer needs decent memory
      - '--cpu'
      - '1'
      - '--max-instances'
      - '100' # Massive parallel scraping fleet
      - '--set-env-vars'
      - 'RUN_AS_WORKER=true,PORT=8080'
images:
  - 'gcr.io/$PROJECT_ID/deep-researcher-fleet'
