services:
  inso_code_app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: inso_code_app
    env_file:
      - .env
    ports:
      - '5100:5100'
    volumes:
      - ../INSO_CODE_BACKEND:/app/inso-code-service
      - node_modules_cache:/app/inso-code-service/node_modules
    networks:
      - inso_code_network
    depends_on:
      - elasticsearch
      - kibana
      - nemo_engine # Integration: Wait for NeMo engine
    restart: unless-stopped

  nemo_engine:
    build:
      context: ./alti.code.studio.engine
      dockerfile: Dockerfile
    container_name: nemo_engine
    ports:
      - '8000:8000'
    volumes:
      - ./alti.code.studio.engine:/app
    networks:
      - inso_code_network
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:7.9.2
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    ports:
      - '9200:9200'
      - '9300:9300'
    networks:
      - inso_code_network


  kibana:
    image: kibana:7.9.2
    container_name: kibana
    restart: always
    environment:
      ELASTICSEARCH_HOSTS: 'http://elasticsearch:9200'
    ports:
      - '5601:5601'
    depends_on:
      - elasticsearch
    networks:
      - inso_code_network

  inso_code_editor:
    image: codercom/code-server:latest
    container_name: inso_code_editor
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:-123456}
      - TZ=Asia/Dhaka
    ports:
      - '8080:8080'
    command: ['--bind-addr', '0.0.0.0:8080', '--auth', 'password', '.']
    user: root
    # REMOVE project mount to stop auto-loading!
    volumes:
      #  - "C:/:/user-projects"
      - /user-projects:/user-projects
      - code_server_data:/home/coder/.local/share/code-server
      - ./vscode-settings.json:/home/coder/.local/share/code-server/User/settings.json

    networks:
      - inso_code_network
    restart: unless-stopped

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - '6379:6379'
      - '8001:8001'
    volumes:
      - redis_data:/var/lib/redis
    environment:
      - REDIS_ARGS= --save 900 1
    networks:
      - inso_code_network

  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - inso_code_network
    restart: always

  openhands_worker:
    image: public.ecr.aws/a6z2u6p4/openhands:latest
    container_name: openhands_worker
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=public.ecr.aws/a6z2u6p4/openhands-sandbox:latest
      - WORKSPACE_MOUNT_PATH=/workspace
    ports:
      - '3005:3000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands-state:/.openhands-state
      - ./workspace:/workspace
    networks:
      - inso_code_network
    restart: unless-stopped

  swe_kit_worker:
    image: ghcr.io/swe-kit/swe-kit:latest
    container_name: swe_kit_worker
    ports:
      - '3006:8080'
    volumes:
      - ./workspace:/workspace
    networks:
      - inso_code_network
    restart: unless-stopped

  crewai_worker:
    build:
      context: ./docker/crewai
    container_name: crewai_worker
    ports:
      - '3007:8000'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - inso_code_network
    restart: unless-stopped

  camel_worker:
    build:
      context: ./docker/camel
    container_name: camel_worker
    ports:
      - '3008:8000'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - inso_code_network
    restart: unless-stopped

  haystack_worker:
    build:
      context: ./docker/haystack
    container_name: haystack_worker
    ports:
      - '3009:8000'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - inso_code_network
    restart: unless-stopped

  microsoft_agent_worker:
    build:
      context: ./docker/microsoft-agent
    container_name: microsoft_agent_worker
    ports:
      - '3010:8000'
    networks:
      - inso_code_network
    restart: unless-stopped

  google_adk_worker:
    build:
      context: ./docker/google-adk
    container_name: google_adk_worker
    ports:
      - '3011:8000'
    networks:
      - inso_code_network
    restart: unless-stopped

  nemo_agent_worker:
    build:
      context: ./docker/nemo-agent
    container_name: nemo_agent_worker
    ports:
      - '3012:8000'
    networks:
      - inso_code_network
    restart: unless-stopped

  openai_sdk_worker:
    build:
      context: ./docker/openai-sdk
    container_name: openai_sdk_worker
    ports:
      - '3013:8000'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - inso_code_network
    restart: unless-stopped

  anthropic_ptc_worker:
    build:
      context: ./docker/anthropic-ptc
    container_name: anthropic_ptc_worker
    ports:
      - '3014:8000'
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      - inso_code_network
    restart: unless-stopped

  temporal_worker:
    build:
      context: ./docker/temporal
    container_name: temporal_worker
    ports:
      - '3015:8000'
    networks:
      - inso_code_network
    restart: unless-stopped

  langgraph_worker:
    build:
      context: ./docker/langgraph
    container_name: langgraph_worker
    ports:
      - '3016:8000'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - inso_code_network
    restart: unless-stopped

  mem0_worker:
    build:
      context: ./docker/mem0
    container_name: mem0_worker
    ports:
      - '3017:8000'
    environment:
      - MEM0_API_KEY=${MEM0_API_KEY}
    networks:
      - inso_code_network
    restart: unless-stopped

  langfuse_worker:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: langfuse_worker
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - NEXTAUTH_SECRET=mysecret
      - SALT=mysalt
    networks:
      - inso_code_network
    restart: unless-stopped

  tabby_worker:
    image: tabbyml/tabby
    container_name: tabby_worker
    command: serve --model StarCoder-1B --device cpu
    ports:
      - '8080:8080'
    volumes:
      - ~/.tabby:/data
    networks:
      - inso_code_network
    restart: unless-stopped

  browser_use_worker:
    build:
      context: ./docker/browser-use
    container_name: browser_use_worker
    ports:
      - '3018:8000'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - inso_code_network
    restart: unless-stopped

  crawl4ai_worker:
    build:
      context: ./docker/crawl4ai
    container_name: crawl4ai_worker
    ports:
      - '3019:8000'
    networks:
      - inso_code_network
    restart: unless-stopped

  mcp_sqlite_server:
    image: mcp/sqlite
    container_name: mcp_sqlite_server
    command: sqlite3 /data/test.db
    volumes:
      - ./data:/data
    ports:
      - '3020:3020'
    networks:
      - inso_code_network
    restart: unless-stopped

  dspy_worker:
    build:
      context: ./docker/dspy
    container_name: dspy_worker
    ports:
      - '3021:8000'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - inso_code_network
    restart: unless-stopped

  unstructured_worker:
    image: downloads.unstructured.io/unstructured-io/unstructured:latest
    container_name: unstructured_worker
    ports:
      - '3022:8000'
    networks:
      - inso_code_network
    restart: unless-stopped

  promptfoo_worker:
    image: promptfoo/promptfoo
    container_name: promptfoo_worker
    ports:
      - '3023:3000'
    networks:
      - inso_code_network
    restart: unless-stopped

  litellm_proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm_proxy
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - inso_code_network
    restart: unless-stopped

  qdrant_db:
    image: qdrant/qdrant
    container_name: qdrant_db
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - inso_code_network
    restart: unless-stopped

  ollama_worker:
    image: ollama/ollama
    container_name: ollama_worker
    ports:
      - '11434:11434'
    volumes:
      - ./ollama_models:/root/.ollama
    networks:
      - inso_code_network
    restart: unless-stopped
    # If using GPU, requires additional deploy: resources: reservations: devices configuration

  searxng_worker:
    image: searxng/searxng
    container_name: searxng_worker
    ports:
      - '8081:8080'
    volumes:
      - ./searxng_config:/etc/searxng
    networks:
      - inso_code_network
    restart: unless-stopped

  open_interpreter_worker:
    build:
      context: ./docker/open-interpreter
    container_name: open_interpreter_worker
    ports:
      - '3024:8000'
    networks:
      - inso_code_network
    restart: unless-stopped

  kong_api_gateway:
    image: kong:latest
    container_name: kong_gateway
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    volumes:
      - ./kong:/kong/declarative
    networks:
      - inso_code_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - inso_code_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    networks:
      - inso_code_network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - inso_code_network
    restart: unless-stopped
    
  whisper_worker:
    build:
      context: ./docker/whisper
    container_name: whisper_worker
    ports:
      - '3025:8000'
    networks:
      - inso_code_network
    restart: unless-stopped

  stirling_pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling_pdf
    ports:
      - '8082:8080'
    environment:
      - DOCKER_ENABLE_SECURITY=false
    networks:
      - inso_code_network
    restart: unless-stopped

networks:
  inso_code_network:
    driver: bridge

volumes:
  code_server_data:
  node_modules_cache:
  redis_data:
  mongo_data:
