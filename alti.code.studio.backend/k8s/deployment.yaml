apiVersion: apps/v1
kind: Deployment
metadata:
  name: alti-backend
  labels:
    app: alti-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alti-backend
  template:
    metadata:
      labels:
        app: alti-backend
    spec:
      containers:
      - name: alti-backend
        image: alti-code-studio-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: REDIS_URL
          value: "redis://redis-cluster:6379"
        - name: GCP_PROJECT
          valueFrom:
            secretKeyRef:
              name: gcp-secrets
              key: project-id
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
