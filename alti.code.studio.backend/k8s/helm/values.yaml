# Alti Code Studio Omni-Cloud Sovereign Operator Values
replicaCount: 3

image:
  repository: gcr.io/alti-code-studio/omni-sovereign-backend
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 5000

# 🛡️ SOVEREIGN ZERO-TRUST SECURITY MATRIX
sovereign:
  strictIngress: true  # Drops all non-whitelisted internal namespaces
  strictEgress: true   # Blocks Cloud Metadata API (SSRF Protection)
  fips140_2_enabled: true # Forces hardware-level encryption at rest via KMS
  gVisorSandbox: true  # Enforces runtime container isolation

# 🌍 44 CLOUD PROVIDER FLEET REGISTRY
# The Operator will dynamically configure the target cloud provider based on node affinity and region
omniCloud:
  activeProvider: "google-cloud" # Default, dynamically overridden by CI/CD or Router
  supportedProviders:
    - openstack
    - aws
    - google-cloud
    - azure
    - coreweave
    - lambda-labs
    - runpod
    - digitalocean
    - linode
    - vultr
    - ovh
    - scaleway
    - ibm-cloud
    - oracle-cloud
    - alibaba-cloud
    - tencent-cloud
    - heroku
    - render
    - fly-io
    - railway
    - vercel # Serverless Fallback
    - netlify # Edge Fallback
    # ... up to 44 providers dynamically mapped by the CloudProviderRegistry.js
  
  # Auto-failover configuration
  highAvailability:
    enabled: true
    fallbackThresholdMs: 250
    primaryFailover: "coreweave"
    secondaryFailover: "aws"

resources: 
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# HPA (Horizontal Pod Autoscaler) - Scales based on Swarm Intelligence load
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Environment Injection (Secrets mounted securely via external KMS operator)
env:
  NODE_ENV: "production"
  SOVEREIGN_MODE: "true"
  REDIS_URL: "redis://redis-stack:6379"
  DATABASE_URL: "postgresql://pg:5432/sovereign_db"

# ── FRONTEND SERVICE CONFIG ──
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: gcr.io/alti-code-studio/omni-sovereign-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

customerDomain: "generic-tenant.insocode.com"
