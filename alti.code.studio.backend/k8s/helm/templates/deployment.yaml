apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: alti-code-studio-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    sovereign-tier: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: alti-code-studio-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alti-code-studio-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        sovereign-tier: backend
    spec:
      {{- if .Values.sovereign.gVisorSandbox }}
      runtimeClassName: gvisor # Enforce Strict Hardware-Virtualization Sandbox Runtime
      {{- end }}
      containers:
        - name: backend-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: socketio
              containerPort: 5100
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            # Injecting Omni-Cloud Configuration Dynamically
            - name: OMNI_CLOUD_PROVIDER
              value: {{ .Values.omniCloud.activeProvider | quote }}
          {{- if .Values.sovereign.fips140_2_enabled }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir:
            medium: Memory # Ephemeral in-memory tmp dir for secure execution
