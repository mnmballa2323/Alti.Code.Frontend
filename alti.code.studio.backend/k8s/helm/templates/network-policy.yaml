apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-zero-trust
  labels:
    app.kubernetes.io/name: alti-code-studio-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alti-code-studio-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- if .Values.sovereign.strictIngress }}
  # Strict Sovereign Zero-Trust Ingress (Allow only specific namespaces and frontend UI)
  - from:
    - namespaceSelector:
        matchLabels:
          sovereign-tier: frontend
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: alti-api-gateway
    ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
    - protocol: TCP
      port: 5100 # Socket.IO Port
  {{- else }}
  - ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
    - protocol: TCP
      port: 5100
  {{- end }}
  egress:
  # Allow strictly defined egress to Sovereign Data Layers (Postgres, Redis)
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql-vector
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis-stack
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
  # Cloud API Egress - Allowed explicitly to specific cloud providers based on values
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        {{- if .Values.sovereign.strictEgress }}
        except:
        - 169.254.169.254/32 # Block EC2/GCP Metadata Server Access (Anti-SSRF)
        {{- end }}
    ports:
    - protocol: TCP
      port: 443 # HTTPS for Cloud APIs (Google Gen AI, CoreWeave, Azure)
