apiVersion: apps/v1
kind: Deployment
metadata:
  name: alti-swarm-router
  labels:
    app: alti-swarm-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alti-swarm-router
  template:
    metadata:
      labels:
        app: alti-swarm-router
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: alti-swarm-router
        image: gcr.io/your-project/alti-swarm-router:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: NODE_ENV
          value: "production"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/secrets/google-credentials.json"
        volumeMounts:
        - name: gcp-credentials
          mountPath: /etc/secrets
          readOnly: true
      volumes:
      - name: gcp-credentials
        secret:
          secretName: gcp-credentials-secret
