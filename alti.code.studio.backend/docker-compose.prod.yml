version: '3.8'

services:
  alti-backend:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000-3002:3000" # Expose scaled instances
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    deploy:
      resources:
        limits:
          memory: 2048M
    depends_on:
      - redis
      - jaeger
    networks:
      - alti-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - alti-net

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - alti-net

  grafana:
    image: grafana/grafana
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "3001:3000" # Map to 3001 to avoid conflict with backend
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - alti-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "14268:14268" # Collector
      - "4318:4318"   # OTLP http
    networks:
      - alti-net

  postgres:
    image: ankane/pgvector:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    command: postgres -c shared_buffers=2GB -c work_mem=64MB -c effective_cache_size=6GB -c max_connections=250 -c autovacuum_max_workers=5 -c autovacuum_vacuum_scale_factor=0.05 -c autovacuum_analyze_scale_factor=0.02
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=alti_db
    deploy:
      resources:
        limits:
          memory: 4096M
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alti-net

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CUSTOMER_DOMAIN=${CUSTOMER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - alti-backend
    networks:
      - alti-net

networks:
  alti-net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
