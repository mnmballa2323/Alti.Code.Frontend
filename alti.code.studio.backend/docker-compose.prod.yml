version: '3.8'

services:
  alti-backend:
    build: 
      context: .
      dockerfile: Dockerfile
    user: "10001:10001"
    cap_drop:
      - ALL
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    deploy:
      resources:
        limits:
          memory: 2048M
    depends_on:
      - redis
      - jaeger
    networks:
      - alti-net

  redis:
    image: redis:alpine
    cap_drop:
      - ALL
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - alti-net

  prometheus:
    image: prom/prometheus
    cap_drop:
      - ALL
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - alti-net

  grafana:
    image: grafana/grafana
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "3001:3000" # Map to 3001 to avoid conflict with backend
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - alti-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "14268:14268" # Collector
      - "4318:4318"   # OTLP http
    networks:
      - alti-net

  postgres:
    image: ankane/pgvector:latest
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      - "5432:5432"
    command: postgres -c shared_buffers=2GB -c work_mem=64MB -c effective_cache_size=6GB -c max_connections=250 -c autovacuum_max_workers=5 -c autovacuum_vacuum_scale_factor=0.05 -c autovacuum_analyze_scale_factor=0.02
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=alti_db
    deploy:
      resources:
        limits:
          memory: 4096M
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alti-net

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    networks:
      - alti-net

  alti-frontend:
    build:
      context: ../alti.code.studio.frontend
      dockerfile: Dockerfile
    user: "1001:1001"
    cap_drop:
      - ALL
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${CUSTOMER_DOMAIN}
      - NEXTAUTH_URL=https://${CUSTOMER_DOMAIN}
      - NEXTAUTH_SECRET=7f51152a514d3c907b8b4a2e5f5f4b26
    deploy:
      resources:
        limits:
          memory: 2048M
    depends_on:
      - alti-backend
    networks:
      - alti-net

  caddy:
    image: caddy:alpine
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CUSTOMER_DOMAIN=${CUSTOMER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - alti-backend
      - alti-frontend
    networks:
      - alti-net

networks:
  alti-net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
