apiVersion: apps/v1
kind: Deployment
metadata:
  name: alti-backend-gcp
  namespace: default
  labels:
    app: alti-backend-gcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alti-backend-gcp
  template:
    metadata:
      labels:
        app: alti-backend-gcp
    spec:
      containers:
      - name: backend-gcp
        image: registry.internal.libertycenterone.com/alti-backend-gcp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5003"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5003
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5003
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: alti-backend-gcp
spec:
  type: ClusterIP
  selector:
    app: alti-backend-gcp
  ports:
  - port: 80
    targetPort: 5003
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alti-backend-gcp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alti-backend-gcp
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
