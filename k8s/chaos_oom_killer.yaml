apiVersion: batch/v1
kind: Job
metadata:
  name: chaos-oom-killer
  namespace: default
spec:
  # Do not automatically restart the job after the OOM kill, we just want to observe the failure
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: chaos-oom-killer
    spec:
      containers:
      - name: memory-hog
        image: python:3.10-slim
        # We enforce a strict 256Mi memory limit.
        # When the script exceeds this, the Kubelet / Linux Cgroups will instantly SIGKILL it.
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        command: ["python", "-c"]
        args:
        - |
          import time
          import sys
          
          print("==================================================")
          print("  CHAOS ENGINEERING: OUT OF MEMORY (OOM) KILLER   ")
          print("==================================================")
          print("[CHAOS] Simulating a massive memory leak...")
          
          # We allocate memory in 10MB chunks until the Linux Kernel steps in
          megabytes = []
          chunk_size = 10 * 1024 * 1024 # 10 MB of bytes
          
          try:
              while True:
                  # Append a 10MB block of random bytes to the list
                  megabytes.append(bytearray(chunk_size))
                  allocated = len(megabytes) * 10
                  print(f"[CHAOS] Allocated {allocated} MB of RAM...")
                  
                  # Sleep briefly so metrics agents (Prometheus) have a chance to record the spike
                  time.sleep(0.5)
                  
          except MemoryError:
              # In Python, MemoryError is sometimes caught before the kernel OOM Killer acts,
              # but within Kubernetes cgroups, the SIGKILL usually happens abruptly without python knowing.
              print("[ERROR] Caught MemoryError. The limit was reached.")
              sys.exit(1)
      restartPolicy: Never
