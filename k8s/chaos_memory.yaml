apiVersion: batch/v1
kind: CronJob
metadata:
  name: chaos-memory-stress
  namespace: kube-system
spec:
  schedule: "*/50 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: stress-ng
            image: polinux/stress-ng
            command: ["stress-ng", "--vm", "1", "--vm-bytes", "80%", "--vm-hang", "0", "--timeout", "60s"]
          restartPolicy: Never
