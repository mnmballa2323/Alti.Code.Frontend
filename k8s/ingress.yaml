# -------------------------------------------------------------
# TLS Certificate via cert-manager (Let's Encrypt)
# -------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: inso-code-cert
  namespace: default
spec:
  secretName: alti-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - inso.code
    - api.inso.code
    - fossflow.inso.code

---
# -------------------------------------------------------------
# NGINX Ingress (Octavia Load Balancer backend)
# -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alti-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Cert-manager will automatically provision the secret referenced in TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # SSL Redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - inso.code
        - api.inso.code
        - fossflow.inso.code
      secretName: alti-tls-secret
  rules:
  - host: inso.code
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alti-frontend
            port:
              number: 80
  
  - host: api.inso.code
    http:
      paths:
      - path: /api/v1/gcp
        pathType: Prefix
        backend:
          service:
            name: alti-backend-gcp
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alti-backend
            port:
              number: 80

  - host: fossflow.inso.code
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fossflow
            port:
              number: 80
