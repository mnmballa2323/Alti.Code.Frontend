apiVersion: v1
kind: LimitRange
metadata:
  name: workspace-limits
  namespace: workspaces
spec:
  limits:
  - default:
      cpu: 1000m
      memory: 2Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
    max:
      cpu: 4000m
      memory: 8Gi
    type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workspace-quota
  namespace: workspaces
spec:
  hard:
    pods: "100"
    requests.cpu: "25"
    requests.memory: "50Gi"
    limits.cpu: "100"
    limits.memory: "200Gi"
