apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: default
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow all pods to resolve DNS
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-intra-pod
  namespace: default
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orchestrator-outbound
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: terraform-orchestrator
  policyTypes:
  - Egress
  egress:
  # Allow orchestrator to access AWS, Azure, GCP APIs over HTTPS
  - ports:
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP
