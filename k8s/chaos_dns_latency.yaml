apiVersion: batch/v1
kind: Job
metadata:
  name: chaos-dns-latency-injector
  namespace: kube-system
spec:
  # The chaos lasts for 5 minutes
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: chaos-dns-latency
    spec:
      serviceAccountName: chaos-dns-injector
      containers:
      - name: latency-injector
        # Requires an image with tc (iproute2) and kubectl
        image: bitnami/kubectl:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "[CHAOS] Initializing DNS Latency Injector..."
          
          # Install iproute2 to get the 'tc' command
          apt-get update && apt-get install -y iproute2
          
          # Find all running CoreDNS pods
          COREDNS_PODS=$(kubectl get pods -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[*].metadata.name}')
          
          if [ -z "$COREDNS_PODS" ]; then
            echo "[ERROR] No CoreDNS pods found!"
            exit 1
          fi
          
          echo "[CHAOS] Found CoreDNS pods: $COREDNS_PODS"
          
          # We execute into each CoreDNS pod and use Linux Traffic Control (tc)
          # to add a massive 3000ms (3 second) delay to all outgoing DNS responses on port 53.
          # This simulates a severely degraded upstream DNS resolver.
          for POD in $COREDNS_PODS; do
            echo "[CHAOS] Injecting 3000ms latency into $POD..."
            
            # 1. Setup qdisc on eth0
            kubectl exec -n kube-system $POD -- tc qdisc add dev eth0 root handle 1: prio
            
            # 2. Add the 3000ms delay to band 1
            kubectl exec -n kube-system $POD -- tc qdisc add dev eth0 parent 1:1 handle 10: netem delay 3000ms
            
            # 3. Filter only UDP/TCP Port 53 (DNS) traffic into the delayed band
            kubectl exec -n kube-system $POD -- tc filter add dev eth0 protocol ip parent 1:0 prio 1 u32 match ip sport 53 0xffff flowid 1:1
          done
          
          echo "[CHAOS] DNS Latency injected! All internal cluster resolution will now take 3+ seconds."
          echo "[CHAOS] Validating microservice resilience:"
          echo "  1. Do application thread pools exhaust while waiting for DNS resolution?"
          echo "  2. Are DNS timeouts properly configured (e.g. ndots:5 optimization)?"
          echo "  3. Do internal circuit breakers trip correctly?"
          
          # Sleep for the duration of the chaos experiment (4.5 minutes)
          sleep 270
          
          echo "[CHAOS] Reverting DNS latency..."
          for POD in $COREDNS_PODS; do
            kubectl exec -n kube-system $POD -- tc qdisc del dev eth0 root || true
          done
          
          echo "[CHAOS] Experiment complete."
      restartPolicy: Never
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-dns-injector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-dns-injector-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-dns-injector-binding
subjects:
- kind: ServiceAccount
  name: chaos-dns-injector
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: chaos-dns-injector-role
  apiGroup: rbac.authorization.k8s.io
