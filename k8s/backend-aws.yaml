apiVersion: apps/v1
kind: Deployment
metadata:
  name: alti-backend-aws
  namespace: default
  labels:
    app: alti-backend-aws
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alti-backend-aws
  template:
    metadata:
      labels:
        app: alti-backend-aws
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: sovereign.cloud/environment
                operator: In
                values:
                - aws
      tolerations:
      - key: "sovereign.cloud/environment"
        operator: "Equal"
        value: "aws"
        effect: "NoSchedule"
      containers:
      - name: backend-aws
        image: registry.internal.libertycenterone.com/alti-backend-aws:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5001"
        - name: AWS_REGION
          value: "us-east-1"
        securityContext:
          drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: alti-backend-aws
spec:
  type: ClusterIP
  selector:
    app: alti-backend-aws
  ports:
  - port: 80
    targetPort: 5001
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alti-backend-aws-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alti-backend-aws
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alti-backend-aws-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: alti-backend-aws
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0 # Restricted to AWS Bedrock IP ranges in production
    ports:
    - protocol: TCP
      port: 443
