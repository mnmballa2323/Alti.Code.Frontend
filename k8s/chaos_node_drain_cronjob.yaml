apiVersion: batch/v1
kind: CronJob
metadata:
  name: chaos-node-drain
  namespace: chaos-testing
spec:
  schedule: "0 2 * * *" # Run daily at 2 AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: chaos-operator
          containers:
          - name: chaos-node-drain
            image: python:3.9-slim
            command: ["/bin/bash", "-c"]
            args:
              - "pip install kubernetes && python /scripts/chaos_node_drain.py"
            env:
              - name: CHAOS_DURATION_SECONDS
                value: "120"
            volumeMounts:
            - name: scripts
              mountPath: /scripts
          volumes:
          - name: scripts
            configMap:
              name: chaos-node-drain-script
          restartPolicy: OnFailure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-node-drain-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-node-drain-binding
subjects:
- kind: ServiceAccount
  name: chaos-operator
  namespace: chaos-testing
roleRef:
  kind: ClusterRole
  name: chaos-node-drain-role
  apiGroup: rbac.authorization.k8s.io
