# -------------------------------------------------------------
# Google Managed Prometheus (GMP) Custom Metrics Scraper
# -------------------------------------------------------------

apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: alti-backend-metrics
  namespace: default
  labels:
    app.kubernetes.io/name: alti-backend
spec:
  selector:
    matchLabels:
      app: alti-backend
  endpoints:
  - port: 5000
    interval: 30s
    path: /metrics
    # Scrape timeout
    timeout: 15s

---
