apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fpga-hardware-alerts
  namespace: security
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
  - name: fpga.rules
    rules:
    # 1. Hardware Overheating Alert
    - alert: FPGAHardwareOverheating
      expr: fpga_temperature_celsius > 85
      for: 2m
      labels:
        severity: critical
        team: hardware-ops
      annotations:
        summary: "FPGA Silicon is dangerously hot (Instance: {{ $labels.instance }})"
        description: "The internal temperature of the AWS F1 FPGA core has exceeded 85°C. Risk of hardware damage or throttling."
        runbook_url: "https://wiki.alticodestudio.com/runbooks/fpga-overheating"

    # 2. AFI Image Crash / Unloaded
    - alert: FPGAAfiImageCrashed
      expr: fpga_status == 0
      for: 1m
      labels:
        severity: critical
        team: hardware-ops
      annotations:
        summary: "FPGA AFI Image is no longer loaded (Instance: {{ $labels.instance }})"
        description: "The fpga-describe-local-image tool reports the Amazon FPGA Image (AFI) is not 'loaded'. Cryptographic operations will fail."

    # 3. High Power Consumption
    - alert: FPGAPowerConsumptionSpike
      expr: fpga_power_watts > 35
      for: 5m
      labels:
        severity: warning
        team: hardware-ops
      annotations:
        summary: "High FPGA Power Consumption (Instance: {{ $labels.instance }})"
        description: "The FPGA is consistently drawing more than 35 Watts, indicating extreme load or a potential infinite loop in the silicon logic."

    # 4. Service Unreachable (Exporter Down)
    - alert: FPGAExporterDown
      expr: up{job="fpga-hardware-exporter"} == 0
      for: 3m
      labels:
        severity: warning
        team: monitoring
      annotations:
        summary: "FPGA hardware exporter is down"
        description: "Prometheus failed to scrape the FPGA hardware metrics exporter for 3 minutes. Telemetry is blind."
