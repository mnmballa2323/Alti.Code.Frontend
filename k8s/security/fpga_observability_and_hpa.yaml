apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fpga-crypto-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: crypto-accelerator
  namespaceSelector:
    matchNames:
      - security
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
    # Scrape specific FPGA hardware telemetry exposed by our service
    # e.g., fpga_temperature_celsius, fpga_power_watts, fpga_crypto_ops_total
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fpga-crypto-hpa
  namespace: security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crypto-accelerator-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Pods
    pods:
      metric:
        name: fpga_crypto_ops_total
      target:
        type: AverageValue
        # Target 50,000 cryptographic operations per second per FPGA node
        averageValue: 50k
