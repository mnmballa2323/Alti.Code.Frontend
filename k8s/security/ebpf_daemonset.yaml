apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-security-monitor
  namespace: kube-system
  labels:
    app: ebpf-security-monitor
spec:
  selector:
    matchLabels:
      app: ebpf-security-monitor
  template:
    metadata:
      labels:
        app: ebpf-security-monitor
    spec:
      hostPID: true
      hostNetwork: true
      containers:
      - name: ebpf-monitor
        image: nicolaka/netshoot:latest
        command: ["/bin/bash", "-c"]
        args:
          - "apt-get update && apt-get install -y bpfcc-tools linux-headers-$(uname -r) && python3 /scripts/ebpf_monitor.py"
        securityContext:
          privileged: true
        volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: sys-kernel-debug
          mountPath: /sys/kernel/debug
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: sys-kernel-debug
        hostPath:
          path: /sys/kernel/debug
      - name: scripts
        configMap:
          name: ebpf-monitor-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebpf-monitor-script
  namespace: kube-system
data:
  ebpf_monitor.py: |
    # Script content is managed separately and injected here during CI/CD or using a Kustomize patch.
    # We mount it from the configmap.
