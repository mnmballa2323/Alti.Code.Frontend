apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: crypto-routing-mesh
  namespace: security
spec:
  hosts:
  - "crypto-service.internal.cluster.local"
  http:
  # Route computationally intensive Asymmetric Cryptography to FPGA
  - match:
    - uri:
        prefix: "/api/v1/crypto/rsa4096"
    - uri:
        prefix: "/api/v1/crypto/ecdsa"
    - headers:
        X-Requires-Hardware-Acceleration:
          exact: "true"
    route:
    - destination:
        host: crypto-accelerator-svc.security.svc.cluster.local
        port:
          number: 8443
      # Add custom retry logic because FPGAs might be briefly busy loading AFIs
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes

  # Default route: Standard symmetric crypto (AES) stays on CPU nodes
  - route:
    - destination:
        host: standard-crypto-svc.security.svc.cluster.local
        port:
          number: 8443

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: fpga-crypto-circuit-breaker
  namespace: security
spec:
  host: crypto-accelerator-svc.security.svc.cluster.local
  trafficPolicy:
    # Mutual TLS internal to the cluster
    tls:
      mode: ISTIO_MUTUAL
    # Connection pool protecting the FPGA instances from being overwhelmed
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 100
    # Outlier detection (Circuit Breaking) to eject failing FPGA nodes
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
