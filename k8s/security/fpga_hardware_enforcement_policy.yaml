apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8srequiredfpgaacceleration
  annotations:
    description: "Requires specific high-security workloads to use the FPGA hardware cryptographic accelerator via annotations."
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredFpgaAcceleration
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredfpgaacceleration

        # Check if the namespace is in a strict security zone (e.g., PCI-DSS payments)
        is_strict_namespace(ns) {
          strict_namespaces := {"payments", "auth", "secrets"}
          strict_namespaces[ns]
        }

        violation[{"msg": msg}] {
          # Only apply to Pods
          input.review.kind.kind == "Pod"
          
          # Only apply to strictly secured namespaces
          is_strict_namespace(input.review.object.metadata.namespace)
          
          # Check if the mutating webhook annotation is present and set to true
          fpga_annotation := input.review.object.metadata.annotations["alti.code.studio/inject-fpga-crypto"]
          not fpga_annotation == "true"
          
          msg := sprintf("SECURITY VIOLATION: Pod %v in strict namespace '%v' MUST be configured to use the FPGA Hardware Cryptographic Accelerator. Missing or invalid annotation: alti.code.studio/inject-fpga-crypto=true", [input.review.object.metadata.name, input.review.object.metadata.namespace])
        }

        # Also catch Deployments/StatefulSets directly so the error is visible to the developer immediately
        violation[{"msg": msg}] {
          supported_kinds := {"Deployment", "StatefulSet", "DaemonSet", "Job"}
          supported_kinds[input.review.kind.kind]
          
          is_strict_namespace(input.review.object.metadata.namespace)
          
          # Look at the pod template annotations
          pod_annotations := input.review.object.spec.template.metadata.annotations
          fpga_annotation := pod_annotations["alti.code.studio/inject-fpga-crypto"]
          not fpga_annotation == "true"
          
          msg := sprintf("SECURITY VIOLATION: %v %v in strict namespace '%v' MUST inject the FPGA Hardware Cryptographic Accelerator into its Pod template. Add annotation: alti.code.studio/inject-fpga-crypto=true", [input.review.kind.kind, input.review.object.metadata.name, input.review.object.metadata.namespace])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredFpgaAcceleration
metadata:
  name: require-fpga-in-strict-namespaces
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: ["batch"]
        kinds: ["Job"]
    namespaces:
      - payments
      - auth
      - secrets
  # Set to Deny to actively block non-compliant deployments
  enforcementAction: deny
