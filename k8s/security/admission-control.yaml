# -------------------------------------------------------------
# Kyverno Admission Control Policies
# -------------------------------------------------------------

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-specific-image-tags
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/description: >-
      The 'latest' tag is mutable and can lead to unexpected errors if the
      image changes. This policy enforces that a specific tag or digest must 
      be used for all container images.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: require-image-tag
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "An image tag is required and cannot be 'latest'."
      pattern:
        spec:
          containers:
          - image: "!*:latest"

---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/description: >-
      Images must be pulled from the trusted Google Artifact Registry. 
      Prevents developers from deploying untrusted images directly from Docker Hub.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: validate-registries
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Images must be pulled from the trusted Artifact Registry (us-central1-docker.pkg.dev)."
      pattern:
        spec:
          containers:
          - image: "us-central1-docker.pkg.dev/* | gcr.io/*"
