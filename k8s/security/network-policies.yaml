# -------------------------------------------------------------
# Zero-Trust Default Deny
# -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
spec:
  podSelector: {} # Selects all pods in the namespace
  policyTypes:
  - Ingress
  - Egress

---
# -------------------------------------------------------------
# DNS Resolution Allow (Egress)
# Required for all pods to resolve services
# -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: default
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# -------------------------------------------------------------
# Ingress -> Frontend Allow
# -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: alti-frontend
  policyTypes:
  - Ingress
  ingress:
  # GCLB Health Checks and Proxy IPs
  - from:
    - ipBlock:
        cidr: 130.211.0.0/22
    - ipBlock:
        cidr: 35.191.0.0/16
    ports:
    - protocol: TCP
      port: 3000

---
# -------------------------------------------------------------
# Frontend -> Backend Allow
# -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: alti-backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: alti-frontend
    ports:
    - protocol: TCP
      port: 5000
    # GCLB also hits Backend directly via API routing
    - ipBlock:
        cidr: 130.211.0.0/22
    - ipBlock:
        cidr: 35.191.0.0/16

---
# -------------------------------------------------------------
# Backend -> Internal Services Egress Allow
# -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: alti-backend
  policyTypes:
  - Egress
  egress:
  # Backend talking to PentAGI
  - to:
    - podSelector:
        matchLabels:
          app: pentagi
    ports:
    - protocol: TCP
      port: 8443
  
  # Backend talking to external APIs (Stripe, OpenAI, Gemini, etc)
  # In a strict production setup, this would be an egress gateway proxy,
  # but allowing standard 443 egress as a baseline.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
