# -------------------------------------------------------------
# PentAGI Deployment
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pentagi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pentagi
  template:
    metadata:
      labels:
        app: pentagi
    spec:
      containers:
      - name: pentagi
        image: vxcontrol/pentagi:latest
        ports:
        - containerPort: 8443
        env:
        - name: SERVER_PORT
          value: "8443"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_USE_SSL
          value: "false"
        - name: DEBUG
          value: "false"
        - name: PENTAGI_POSTGRES_USER
          value: "postgres"
        # In GCP, connection is usually via Cloud SQL Auth Proxy sidecar or Private IP 
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pentagi-db-secrets
              key: DATABASE_URL
        volumeMounts:
        - name: pentagi-data
          mountPath: /opt/pentagi/data
      volumes:
      - name: pentagi-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pentagi
spec:
  type: ClusterIP
  selector:
    app: pentagi
  ports:
  - port: 8443
    targetPort: 8443
    protocol: TCP

# -------------------------------------------------------------
# Scraper Deployment
# -------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scraper
  template:
    metadata:
      labels:
        app: scraper
    spec:
      containers:
      - name: scraper
        image: vxcontrol/scraper:latest
        ports:
        - containerPort: 443
        env:
        - name: MAX_CONCURRENT_SESSIONS
          value: "10"
---
apiVersion: v1
kind: Service
metadata:
  name: scraper
spec:
  type: ClusterIP
  selector:
    app: scraper
  ports:
  - port: 443
    targetPort: 443
    protocol: TCP

# -------------------------------------------------------------
# FossFLOW Deployment
# -------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fossflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fossflow
  template:
    metadata:
      labels:
        app: fossflow
    spec:
      containers:
      - name: fossflow
        image: stnsmith/fossflow:latest
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: "production"
        - name: ENABLE_SERVER_STORAGE
          value: "true"
        - name: STORAGE_PATH
          value: "/data/diagrams"
        volumeMounts:
        - name: fossflow-data
          mountPath: /data/diagrams
      volumes:
      - name: fossflow-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fossflow
spec:
  type: ClusterIP
  selector:
    app: fossflow
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
