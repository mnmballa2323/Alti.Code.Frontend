apiVersion: batch/v1
kind: Job
metadata:
  name: chaos-imds-blackhole
  namespace: default
spec:
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: chaos-imds-blackhole
    spec:
      # Must run on the host network to manipulate host iptables
      hostNetwork: true
      containers:
      - name: iptables-injector
        image: alpine:latest
        securityContext:
          # Required to modify host network firewall rules
          privileged: true
          capabilities:
            add: ["NET_ADMIN"]
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "=================================================="
          echo "  CHAOS ENGINEERING: AWS IMDS BLACKHOLE SIMULATOR "
          echo "=================================================="
          
          # AWS EC2 instances use the Instance Metadata Service (IMDS) at 169.254.169.254
          # to distribute temporary IAM role credentials (STS tokens) to applications.
          # If the IMDS endpoint fails, AWS SDKs cannot refresh their credentials, 
          # leading to catastrophic AccessDenied (HTTP 403) errors across the entire stack.
          
          IMDS_IP="169.254.169.254"
          
          # Ensure iptables is installed in the alpine container
          apk add --no-cache iptables
          
          echo "[CHAOS] INJECTING FAILURE: Blocking all routing to AWS IMDS ($IMDS_IP)..."
          
          # Insert a DROP rule at the very top of the PREROUTING and OUTPUT chains
          iptables -I OUTPUT -d $IMDS_IP -j DROP
          iptables -I PREROUTING -d $IMDS_IP -j DROP
          
          echo "[CHAOS] Network blackhole established! Applications cannot fetch new AWS credentials."
          echo "[CHAOS] Validating Application Resilience mechanisms:"
          echo "  1. Applications SHOULD have cached their STS credentials (typically valid for 1 hour)."
          echo "  2. Short-lived tasks attempting to boot will immediately crash with 'NoCredentialsError'."
          echo "  3. Prometheus MUST alert on a sudden spike of 'AccessDenied' errors in the AWS API."
          
          # Maintain the chaos state for 3 minutes to allow credential expirations and alerts
          echo "[CHAOS] Holding IMDS blackout for 3 minutes..."
          sleep 180
          
          echo "[CHAOS] Reverting to healthy state. Restoring IMDS routing..."
          iptables -D OUTPUT -d $IMDS_IP -j DROP
          iptables -D PREROUTING -d $IMDS_IP -j DROP
          
          echo "[CHAOS] Network routing restored."
          echo "[CHAOS] Experiment complete."
      restartPolicy: Never
