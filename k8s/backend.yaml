apiVersion: apps/v1
kind: Deployment
metadata:
  name: alti-backend
  namespace: default
  labels:
    app: alti-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alti-backend
  template:
    metadata:
      labels:
        app: alti-backend
    spec:
      containers:
      - name: backend
        # In production this would be replaced with your Google Artifact Registry image URI
        image: gcr.io/PROJECT_ID/alti-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: PENTAGI_API_URL
          value: "http://pentagi:8443/api/v1"
        # Secrets would typically be injected via External Secrets Operator syncing from GCP Secret Manager
        # Using a dummy secret reference as a placeholder
        envFrom:
        - secretRef:
            name: alti-backend-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /api/swarm/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/swarm/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: alti-backend
  annotations:
    # Use Container-Native Load Balancing on Google Cloud
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: alti-backend
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alti-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alti-backend
  minReplicas: 3
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
