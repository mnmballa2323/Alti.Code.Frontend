apiVersion: batch/v1
kind: Job
metadata:
  name: chaos-autoscaler-failure
  namespace: default
spec:
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: chaos-autoscaler-failure
    spec:
      serviceAccountName: chaos-autoscaler-service-account
      containers:
      - name: autoscaler-killer
        image: bitnami/kubectl:latest
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "=================================================="
          print "  CHAOS ENGINEERING: KARPENTER AUTOSCALER FAILURE "
          print "=================================================="
          
          # 1. Scale Karpenter down to 0 replicas to simulate a massive control plane failure
          echo "[CHAOS] Neutralizing Karpenter Auto-Scaler deployment..."
          kubectl scale deployment karpenter -n karpenter --replicas=0 || true
          
          # 2. Deploy a massive number of dummy pods that explicitly request resources
          # Because Karpenter is dead, these pods will be permanently stuck in "Pending"
          echo "[CHAOS] Deploying 500 resource-intensive dummy pods..."
          
          cat << 'PODS' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: chaos-pending-backlog
            namespace: default
          spec:
            replicas: 500
            selector:
              matchLabels:
                app: chaos-pending
            template:
              metadata:
                labels:
                  app: chaos-pending
              spec:
                containers:
                - name: pause
                  image: registry.k8s.io/pause:3.9
                  resources:
                    requests:
                      cpu: "500m"
                      memory: "1Gi"
          PODS
          
          echo "[CHAOS] Attack initiated! The cluster is now starved of EC2 scaling capabilities."
          echo "[CHAOS] Validating Kubernetes Alerting rules:"
          echo "  - Prometheus should detect a massive spike in 'kube_pod_status_phase{phase=\"Pending\"}'."
          echo "  - PagerDuty MUST alert the platform team that the cluster has lost auto-scaling capabilities."
          
          # Maintain the chaos state for 4 minutes to allow alerts to fire
          sleep 240
          
          echo "[CHAOS] Reverting cluster to healthy state..."
          kubectl delete deployment chaos-pending-backlog -n default
          
          echo "[CHAOS] Resurrecting Karpenter Auto-Scaler..."
          kubectl scale deployment karpenter -n karpenter --replicas=2 || true
          
          echo "[CHAOS] Experiment complete."
      restartPolicy: Never
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-autoscaler-service-account
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-autoscaler-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "patch", "create", "delete", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-autoscaler-binding
subjects:
- kind: ServiceAccount
  name: chaos-autoscaler-service-account
  namespace: default
roleRef:
  kind: ClusterRole
  name: chaos-autoscaler-role
  apiGroup: rbac.authorization.k8s.io
