# ═══════════════════════════════════════════════════════════════
# Alti.Code.Studio — Cloud Build CI/CD Pipeline (Phase 38)
# Multi-stage: Lint → Test → Build → Scan → Deploy
# ═══════════════════════════════════════════════════════════════

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  env:
    - 'NODE_ENV=production'
    - 'CI=true'

substitutions:
  _REGION: 'us-central1'
  _CLUSTER: 'alti-gke-cluster'
  _REPO: 'alti-code-studio'
  _NAMESPACE: 'alti-code-studio'

# ═══════════════════════════════════════════════
# Steps
# ═══════════════════════════════════════════════

steps:

  # ── Step 1: Install Dependencies ──
  - id: 'install'
    name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['ci', '--prefer-offline']
    waitFor: ['-']

  # ── Step 2: Lint ──
  - id: 'lint'
    name: 'node:20-alpine'
    entrypoint: 'npx'
    args: ['eslint', 'src/', '--max-warnings=0']
    waitFor: ['install']

  # ── Step 3: Unit Tests ──
  - id: 'test-unit'
    name: 'node:20-alpine'
    entrypoint: 'npx'
    args: ['vitest', 'run', '--reporter=junit', '--outputFile=test-results/unit.xml']
    waitFor: ['install']

  # ── Step 4: Enterprise Tests ──
  - id: 'test-enterprise'
    name: 'node:20-alpine'
    entrypoint: 'npx'
    args: [
      'vitest', 'run',
      'src/app/modules/enterprise/enterprise.test.js',
      'src/app/modules/enterprise/integration.test.js',
      '--reporter=junit',
      '--outputFile=test-results/enterprise.xml'
    ]
    waitFor: ['install']

  # ── Step 5: Build Container ──
  - id: 'build'
    name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}',
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest',
      '--cache-from', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest',
      '.'
    ]
    waitFor: ['test-unit', 'test-enterprise', 'lint']

  # ── Step 6: Container Vulnerability Scan ──
  - id: 'scan'
    name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'artifacts', 'docker', 'images', 'scan',
      '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}',
      '--format=json',
      '--location=${_REGION}'
    ]
    waitFor: ['build']

  # ── Step 7: Push to Artifact Registry ──
  - id: 'push'
    name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      '--all-tags',
      '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api'
    ]
    waitFor: ['scan']

  # ── Step 8: Deploy to GKE (Staging) ──
  - id: 'deploy-staging'
    name: 'gcr.io/cloud-builders/gke-deploy'
    args: [
      'run',
      '--filename=k8s/gke-deployment.yaml',
      '--cluster=${_CLUSTER}',
      '--location=${_REGION}',
      '--namespace=${_NAMESPACE}-staging',
      '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}'
    ]
    waitFor: ['push']

  # ── Step 9: Integration Tests (against staging) ──
  - id: 'test-staging'
    name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Running integration tests against staging..."
        npx vitest run tests/e2e/ --reporter=junit --outputFile=test-results/e2e.xml || true
    waitFor: ['deploy-staging']

  # ── Step 10: Deploy to GKE (Production) ──
  - id: 'deploy-production'
    name: 'gcr.io/cloud-builders/gke-deploy'
    args: [
      'run',
      '--filename=k8s/gke-deployment.yaml',
      '--cluster=${_CLUSTER}',
      '--location=${_REGION}',
      '--namespace=${_NAMESPACE}',
      '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}'
    ]
    waitFor: ['test-staging']

  # ── Step 11: Post-deploy Health Check ──
  - id: 'healthcheck'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Waiting for deployment to be ready..."
        sleep 30
        ENDPOINT=$(kubectl get svc alti-api -n ${_NAMESPACE} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ENDPOINT:3000/api/v1/enterprise/health)
        if [ "$STATUS" != "200" ]; then
          echo "Health check FAILED (HTTP $STATUS)"
          exit 1
        fi
        echo "Health check PASSED ✅"
    waitFor: ['deploy-production']

  # ── Step 12: Notify Slack ──
  - id: 'notify'
    name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"✅ *Alti.Code.Studio* deployed to production\nCommit: \`${SHORT_SHA}\`\nBuild: ${BUILD_ID}\"}" \
          "$$SLACK_WEBHOOK_URL" || true
    secretEnv: ['SLACK_WEBHOOK_URL']
    waitFor: ['healthcheck']

# ═══════════════════════════════════════════════
# Images to push
# ═══════════════════════════════════════════════

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest'

# ═══════════════════════════════════════════════
# Test results
# ═══════════════════════════════════════════════

artifacts:
  objects:
    location: 'gs://${PROJECT_ID}-build-artifacts/${BUILD_ID}'
    paths:
      - 'test-results/**'

# ═══════════════════════════════════════════════
# Secrets
# ═══════════════════════════════════════════════

availableSecrets:
  secretManager:
    - versionName: 'projects/${PROJECT_ID}/secrets/slack-webhook-url/versions/latest'
      env: 'SLACK_WEBHOOK_URL'

# ═══════════════════════════════════════════════
# Timeout & Tags
# ═══════════════════════════════════════════════

timeout: '1800s'
tags:
  - 'alti-code-studio'
  - 'enterprise'
  - 'production'
