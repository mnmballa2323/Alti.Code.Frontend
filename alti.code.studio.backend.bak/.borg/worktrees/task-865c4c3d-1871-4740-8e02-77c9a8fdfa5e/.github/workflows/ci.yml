
name: Alti Code Studio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    env:
      VERTEX_MOCK_MODE: "true" # Force Mock Mode for CI
      
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Linter
      run: npm run lint || true # Don't fail completely on lint yet
      
    - name: Run Unit Tests
      run: npm test
      
    - name: Run Swarm Integration Test
      run: node check_integration_full.js
      
    - name: Run MCP Verification
      run: node check_mcp.js
