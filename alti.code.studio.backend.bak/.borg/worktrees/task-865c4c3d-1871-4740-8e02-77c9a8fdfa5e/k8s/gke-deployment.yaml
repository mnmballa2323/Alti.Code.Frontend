# ═══════════════════════════════════════════════════════════════
# Alti.Code.Studio — GKE Deployment Manifests
# S&P 500 Enterprise Infrastructure on Google Cloud
# ═══════════════════════════════════════════════════════════════

# ── Namespace ──
apiVersion: v1
kind: Namespace
metadata:
  name: alti-code-studio
  labels:
    app: alti-code-studio
    environment: production
    managed-by: gke
---

# ── ConfigMap ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: alti-config
  namespace: alti-code-studio
data:
  NODE_ENV: "production"
  GCP_REGION: "us-central1"
  REDIS_HOST: "redis-master.alti-code-studio.svc.cluster.local"
  REDIS_PORT: "6379"
  ORCHESTRATOR_MODE: "HYBRID"
  LOG_LEVEL: "info"
  APP_VERSION: "2.0.0"
---

# ═══════════════════════════════════════════════
# API Server Deployment
# ═══════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alti-api
  namespace: alti-code-studio
  labels:
    app: alti-api
    component: api-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alti-api
  template:
    metadata:
      labels:
        app: alti-api
        component: api-server
    spec:
      serviceAccountName: alti-api-sa
      containers:
        - name: api
          image: gcr.io/alti-code-studio/api:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: alti-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alti-secrets
                  key: redis-password
            - name: GCP_KMS_KEY
              valueFrom:
                secretKeyRef:
                  name: alti-secrets
                  key: kms-key
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/enterprise/health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/enterprise/health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/v1/enterprise/health/live
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
---

# ── API HorizontalPodAutoscaler ──
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alti-api-hpa
  namespace: alti-code-studio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alti-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---

# ═══════════════════════════════════════════════
# Worker Deployment (Agent Processors)
# ═══════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alti-workers
  namespace: alti-code-studio
  labels:
    app: alti-workers
    component: agent-workers
spec:
  replicas: 5
  selector:
    matchLabels:
      app: alti-workers
  template:
    metadata:
      labels:
        app: alti-workers
        component: agent-workers
    spec:
      serviceAccountName: alti-worker-sa
      containers:
        - name: worker
          image: gcr.io/alti-code-studio/worker:latest
          envFrom:
            - configMapRef:
                name: alti-config
          env:
            - name: WORKER_MODE: "true"
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alti-secrets
                  key: redis-password
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
---

# ── Worker HPA ──
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alti-workers-hpa
  namespace: alti-code-studio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alti-workers
  minReplicas: 5
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---

# ═══════════════════════════════════════════════
# Redis (Memorystore via StatefulSet for dev)
# Production: Use Cloud Memorystore for Redis
# ═══════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: alti-code-studio
spec:
  serviceName: redis-master
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---

# ── Redis Service ──
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: alti-code-studio
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None
---

# ═══════════════════════════════════════════════
# API Service + Ingress
# ═══════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: alti-api-service
  namespace: alti-code-studio
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: alti-api
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
---

# ── Cloud Armor + HTTPS Ingress ──
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alti-ingress
  namespace: alti-code-studio
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "alti-global-ip"
    networking.gke.io/managed-certificates: "alti-cert"
    networking.gke.io/v1beta1.FrontendConfig: "alti-frontend"
spec:
  rules:
    - host: api.alti.code.studio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alti-api-service
                port:
                  number: 80
---

# ── Cloud Armor Security Policy ──
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: alti-frontend
  namespace: alti-code-studio
spec:
  sslPolicy: alti-ssl-policy
  redirectToHttps:
    enabled: true
---

# ═══════════════════════════════════════════════
# Service Accounts (Workload Identity)
# ═══════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alti-api-sa
  namespace: alti-code-studio
  annotations:
    iam.gke.io/gcp-service-account: alti-api@alti-code-studio.iam.gserviceaccount.com
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: alti-worker-sa
  namespace: alti-code-studio
  annotations:
    iam.gke.io/gcp-service-account: alti-worker@alti-code-studio.iam.gserviceaccount.com
---

# ═══════════════════════════════════════════════
# Network Policy (Tenant Isolation)
# ═══════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alti-network-policy
  namespace: alti-code-studio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app: alti-code-studio
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app: alti-code-studio
    - to: # Allow external AI provider access
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
