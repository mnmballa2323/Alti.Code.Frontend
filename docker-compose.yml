
version: '3.8'

services:
  # 🧠 The Brain: Redis (Synapse)
  synapse:
    image: redis:alpine
    container_name: synapse
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alti_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ⚙️ The Engine: Backend
  backend:
    build: ./alti.code.studio.backend
    container_name: alti_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=synapse
      - REDIS_PORT=6379
      - NODE_ENV=production
      # Open-Inspect Background Agent Settings (Phase 2)
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID:-}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      # Secrets should be injected via .env in production
      # PentAGI API Configuration (Phase 3)
      - PENTAGI_API_URL=http://pentagi:8443/api/v1
    depends_on:
      synapse:
        condition: service_healthy
    networks:
      - alti_net

  # ☁️ The AWS Bedrock Microservice
  backend_aws:
    build: ./alti.code.studio.backend.aws
    container_name: alti_backend_aws
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - AWS_REGION=us-east-1
    networks:
      - alti_net

  # ☁️ The Azure Foundry Microservice
  backend_azure:
    build: ./alti.code.studio.backend.azure
    container_name: alti_backend_azure
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    networks:
      - alti_net

  # ☁️ The GCP Vertex Microservice
  backend_gcp:
    build: ./alti.code.studio.backend.gcp
    container_name: alti_backend_gcp
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
    networks:
      - alti_net

  # 🖥️ The Face: Frontend
  frontend:
    build: ./alti.code.studio.frontend
    container_name: alti_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    networks:
      - alti_net

  # 🛡️ PentAGI Autonomous Penetration Testing Server
  pentagi:
    image: vxcontrol/pentagi:latest
    restart: unless-stopped
    container_name: pentagi
    hostname: pentagi
    expose:
      - 8443/tcp
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      pgvector:
        condition: service_started
    environment:
      - DEBUG=false
      - SERVER_USE_SSL=false
      - SERVER_PORT=8443
      - SERVER_HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:postgres@pgvector:5432/pentagidb?sslmode=disable
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_INSIDE=true
      - PENTAGI_POSTGRES_USER=postgres
      - PENTAGI_POSTGRES_PASSWORD=postgres
      - PENTAGI_POSTGRES_DB=pentagidb
      - OPENAI_API_BASE=http://backend_azure:5002/v1
      - OPENAI_BASE_URL=http://backend_azure:5002/v1
      - OPENAI_API_KEY=dummy-key-for-local-proxy
      # Note: Direct connection disabled. Using internal proxy.
    volumes:
      - pentagi-data:/opt/pentagi/data
      - pentagi-ssl:/opt/pentagi/ssl
      - /var/run/docker.sock:/var/run/docker.sock
    user: root:root
    networks:
      - pentagi-network
      - alti_net

  pgvector:
    image: vxcontrol/pgvector:latest
    restart: unless-stopped
    container_name: pgvector
    hostname: pgvector
    expose:
      - 5432/tcp
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pentagidb
    volumes:
      - pentagi-postgres-data:/var/lib/postgresql/data
    networks:
      - pentagi-network

  scraper:
    image: vxcontrol/scraper:latest
    restart: unless-stopped
    container_name: scraper
    hostname: scraper
    expose:
      - 443/tcp
    environment:
      - MAX_CONCURRENT_SESSIONS=10
    volumes:
      - scraper-ssl:/usr/src/app/ssl
    networks:
      - pentagi-network
    shm_size: 2g

  # 🏗️ FossFLOW - Isometric Architecture Designer
  fossflow:
    image: stnsmith/fossflow:latest
    container_name: fossflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      - NODE_ENV=production
      - ENABLE_SERVER_STORAGE=true
      - STORAGE_PATH=/data/diagrams
    volumes:
      - fossflow-data:/data/diagrams
    networks:
      - alti_net

  # 🚀 InsForge - Agentic Backend Platform
  insforge_postgres:
    image: ghcr.io/insforge/postgres:v15.13.2
    container_name: insforge_postgres
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c app.encryption_key='${ENCRYPTION_KEY:-dev-secret-please-change-in-production}'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=insforge
    volumes:
      - insforge-postgres-data:/var/lib/postgresql/data
      - ./submodules/insforge/deploy/docker-init/db/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./submodules/insforge/deploy/docker-init/db/jwt.sql:/docker-entrypoint-initdb.d/02-jwt.sql
      - ./submodules/insforge/deploy/docker-init/db/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5440:5432"
    networks:
      - alti_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  insforge_postgrest:
    image: postgrest/postgrest:v12.2.12
    container_name: insforge_postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@insforge_postgres:5432/insforge
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: dev-secret-please-change-in-production
    ports:
      - "5441:3000"
    depends_on:
      insforge_postgres:
        condition: service_healthy
    networks:
      - alti_net

  insforge_backend:
    build:
      context: ./submodules/insforge
      dockerfile: Dockerfile
      target: runner
      args:
        VITE_API_BASE_URL: http://localhost:7130
    container_name: insforge_backend
    depends_on:
      insforge_postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7130:7130"
      - "127.0.0.1:7131:7131"
    environment:
      - PORT=7130
      - PROJECT_ROOT=/app
      - JWT_SECRET=dev-secret-please-change-in-production
      - ADMIN_EMAIL=admin@alti.code.studio
      - ADMIN_PASSWORD=admin
      - POSTGRES_HOST=insforge_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=insforge
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - DATABASE_URL=postgresql://postgres:postgres@insforge_postgres:5432/insforge
      - POSTGREST_BASE_URL=http://insforge_postgrest:3000
      - DENO_RUNTIME_URL=http://insforge_deno:7133
      - LOGS_DIR=/insforge-logs
      - STORAGE_DIR=/insforge-storage
    volumes:
      - insforge-storage-data:/insforge-storage
      - insforge-shared-logs:/insforge-logs
    restart: unless-stopped
    networks:
      - alti_net

  insforge_deno:
    image: denoland/deno:alpine-2.0.6
    container_name: insforge_deno
    working_dir: /app
    depends_on:
      - insforge_postgres
      - insforge_postgrest
    ports:
      - "127.0.0.1:7133:7133"
    environment:
      - PORT=7133
      - DENO_ENV=production
      - DENO_DIR=/deno-dir
      - POSTGRES_HOST=insforge_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=insforge
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGREST_BASE_URL=http://insforge_postgrest:3000
      - JWT_SECRET=dev-secret-please-change-in-production
    volumes:
      - ./submodules/insforge/functions:/app/functions
      - insforge-deno_cache:/deno-dir
    command: >
      sh -c "
        echo 'Downloading Deno dependencies...' &&
        deno cache functions/server.ts &&
        echo 'Starting Deno server on port 7133...' &&
        deno run --allow-net --allow-env --allow-read=./functions/worker-template.js functions/server.ts
      "
    restart: unless-stopped
    networks:
      - alti_net

  # 🤗 ML Intern - Agentic ML Engineer
  ml_intern:
    build:
      context: ./submodules/ml-intern
      dockerfile: Dockerfile
    container_name: ml_intern
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      - PORT=7860
      - OPENAI_API_BASE=http://backend_azure:5002/v1
      - OPENAI_BASE_URL=http://backend_azure:5002/v1
      - OPENAI_API_KEY=dummy-key-for-local-proxy
      - HF_TOKEN=${HF_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ml-intern-logs:/app/session_logs
    restart: unless-stopped
    networks:
      - alti_net

networks:
  alti_net:
    driver: bridge
  pentagi-network:
    driver: bridge

volumes:
  redis_data:
  pentagi-data:
  pentagi-ssl:
  scraper-ssl:
  pentagi-postgres-data:
  fossflow-data:
  insforge-postgres-data:
  insforge-deno_cache:
  insforge-storage-data:
  insforge-shared-logs:
  ml-intern-logs:
