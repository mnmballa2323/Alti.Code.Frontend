
version: '3.8'

services:
  # 🧠 The Brain: Redis (Synapse)
  synapse:
    image: redis:alpine
    container_name: synapse
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alti_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ⚙️ The Engine: Backend
  backend:
    build: ./alti.code.studio.backend
    container_name: alti_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=synapse
      - REDIS_PORT=6379
      - NODE_ENV=production
      # Secrets should be injected via .env in production
    depends_on:
      synapse:
        condition: service_healthy
    networks:
      - alti_net

  # 🖥️ The Face: Frontend
  frontend:
    build: ./alti.code.studio.frontend
    container_name: alti_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    networks:
      - alti_net

networks:
  alti_net:
    driver: bridge

volumes:
  redis_data:
