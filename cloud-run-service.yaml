# ==============================================================================
# ALTI CODE STUDIO: Cloud Run Production Service Definition
# ==============================================================================
# Deploy with: gcloud run services replace cloud-run-service.yaml
# ==============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: alti-code-studio-backend
  labels:
    cloud.googleapis.com/location: us-central1
    app: alti-code-studio
    tier: backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Autoscaling
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"

        # VPC Connector for private network access (Memorystore, Cloud SQL, etc.)
        run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/us-central1/connectors/alti-vpc-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only

        # Cloud SQL connections (if using Cloud SQL instead of AlloyDB)
        # run.googleapis.com/cloudsql-instances: PROJECT_ID:us-central1:alti-db

        # Startup & liveness probes
        run.googleapis.com/startup-cpu-boost: "true"

        # Session affinity for WebSocket connections
        run.googleapis.com/sessionAffinity: "true"

        # Execution environment
        run.googleapis.com/execution-environment: gen2

    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: alti-backend-sa@PROJECT_ID.iam.gserviceaccount.com

      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/alti-registry/alti-backend:latest
          ports:
            - name: http1
              containerPort: 5000

          resources:
            limits:
              cpu: "4"
              memory: 8Gi

          startupProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

          env:
            # ── Core ──
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"

            # ── GCP Configuration ──
            - name: GCP_PROJECT_ID
              value: "PROJECT_ID"
            - name: GCP_REGION
              value: "us-central1"
            - name: DEPLOYMENT_MODE
              value: "cloud"

            # ── Database (AlloyDB / Cloud SQL via Secret Manager) ──
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: latest

            # ── Redis (Memorystore) ──
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-url
                  key: latest

            # ── AI Gateway ──
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest

            # ── Observability ──
            - name: GCP_ENABLE_TRACING
              value: "true"
            - name: GCP_ENABLE_PROFILING
              value: "true"
            - name: GCP_ENABLE_ERROR_REPORTING
              value: "true"

            # ── Security ──
            - name: GCP_ENABLE_DLP
              value: "true"
            - name: GCP_ENABLE_WEB_RISK
              value: "true"
            - name: GCP_ENABLE_BINARY_AUTH
              value: "false"
            - name: ENABLE_SENTINEL
              value: "false"

            # ── JWT / Auth ──
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest

  traffic:
    - percent: 100
      latestRevision: true
