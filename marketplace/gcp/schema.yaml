info:
  title: Alti Code Studio Data Plane
  version: 1.0.0
  description: >
    Enterprise sovereign data plane for Alti Code Studio. Deploys a Google Distributed Cloud (GDC)
    compatible GKE cluster utilizing Confidential Nodes (AMD SEV) and Titan Security Chips.
    
imports:
  - path: alti-gke-template.py

required:
  - customerName
  - altiControlPlaneMTLSKey
  - zone

properties:
  customerName:
    type: string
    title: Enterprise Organization Name
    description: The name of your enterprise.
    pattern: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
    
  altiControlPlaneMTLSKey:
    type: string
    title: Alti mTLS Key
    description: The cryptographic key to tether to Liberty Center One.
    x-googleProperty:
      type: password
      
  zone:
    type: string
    title: Google Cloud Zone
    description: The zone to deploy the cluster (or GDC Hosted pseudo-region).
    x-googleProperty:
      type: GceZone

  enableConfidentialComputing:
    type: boolean
    title: Enable Confidential Nodes (AMD SEV)
    description: Hardware memory encryption for the Kubernetes nodes.
    default: true
    
  requireTitanSecurityChip:
    type: boolean
    title: Require Titan Security Root-of-Trust
    description: Enforce deployment only on physical servers with verified Titan chips.
    default: true

outputs:
  clusterName:
    type: string
    description: The name of the GKE cluster.
