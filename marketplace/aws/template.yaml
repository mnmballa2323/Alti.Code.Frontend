AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Alti Code Studio - Enterprise Sovereign Data Plane (AWS Marketplace Edition).
  Deploys an isolated EKS cluster inside AWS Nitro Enclaves with CloudHSM backing.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Enterprise Configuration"
        Parameters:
          - CustomerName
          - AltiControlPlaneMTLSKey
      - Label:
          default: "Network & Isolation Settings"
        Parameters:
          - VpcCidr
          - RequireDedicatedHosts
          - EnableQuantumSafeCryptography

Parameters:
  CustomerName:
    Type: String
    Description: Your Enterprise Organization Name.
    MinLength: 3
    MaxLength: 64

  AltiControlPlaneMTLSKey:
    Type: String
    NoEcho: true
    Description: The mTLS provision key provided by your Alti Account Manager to tether to Liberty Center One.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}\\/[0-9]{1,2}$"
    Description: CIDR block for the isolated VPC.

  RequireDedicatedHosts:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enforce deployment on Amazon EC2 Dedicated Physical Hosts.

  EnableQuantumSafeCryptography:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enforce Post-Quantum TLS 1.3 (Kyber) across all endpoints.

Resources:
  AltiIsolatedVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "alti-vpc-${CustomerName}"

  # ==========================================
  # CloudHSM Cluster (Hardware FIPS 140-2 Level 3)
  # ==========================================
  AltiCloudHSM:
    Type: AWS::CloudHSM::Cluster
    Properties:
      HsmType: hsm1.medium
      SubnetIds: [] # Will be populated by dynamic subnets

  # ==========================================
  # EKS Cluster (Nitro Enclaves)
  # ==========================================
  AltiDataPlaneCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub "alti-data-plane-${CustomerName}"
      RoleArn: !GetAtt EksRole.Arn
      Version: "1.29"
      ResourcesVpcConfig:
        SubnetIds: [] # Will be populated by dynamic subnets
        EndpointPrivateAccess: true
        EndpointPublicAccess: false
      EncryptionConfig:
        - Provider:
            KeyArn: "arn:aws:kms:region:account:key/hsm-backed-key" # Placeholder for HSM key logic
          Resources:
            - secrets

  EksRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  # ==========================================
  # Observability: CloudWatch Dashboard
  # ==========================================
  AltiTelemetryDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "Alti-Security-Telemetry-${CustomerName}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AltiCodeStudio", "TokensProcessed", "ClusterName", "${AltiDataPlaneCluster}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "AI Token Throughput (God-Tier Infrastructure)"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/EC2", "NitroEnclaveMemoryUtilization", "ClusterName", "${AltiDataPlaneCluster}" ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Nitro Enclave Memory Encryption Status"
              }
            }
          ]
        }

Outputs:
  ClusterName:
    Description: The name of the deployed Alti Code Studio cluster.
    Value: !Ref AltiDataPlaneCluster
