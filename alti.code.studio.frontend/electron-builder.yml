
appId: com.alticodestudio.app
productName: Alti Code Studio
copyright: Copyright © 2026 Alti Code Studio
directories:
  output: dist
  buildResources: build
files:
  - from: out
    to: .
    filter: ["**/*"]
  - from: electron
    to: electron
    filter: ["**/*"]
  - package.json
  - node_modules/**/*
win:
  target: nsis
  icon: public/favicon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
