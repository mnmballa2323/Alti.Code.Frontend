# Default values for alti-enterprise-byoc

global:
  environment: "production"
  # Target cloud provider: gcp
  cloudProvider: "gcp"
  
  # Connection tether back to Liberty Center One Control Plane
  controlPlane:
    url: "https://controlplane.inso.code.internal"
    mTLSCert: ""
    mTLSKey: ""

microservices:
  gcpVertex:
    enabled: true
    replicaCount: 3
    image:
      repository: registry.inso.code/alti-backend-gcp
      tag: "latest"
    nodeSelector:
      "cloud.google.com/gke-nodepool": "default-pool"

telemetry:
  openTelemetry:
    enabled: true
    # Force usage metrics back to Liberty Center One for billing
    endpoint: "https://otel.inso.code.internal:4317"
