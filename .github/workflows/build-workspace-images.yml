name: Build and Push Workspace Images

on:
  push:
    paths:
      - 'docker/workspaces/**'
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: your-gcp-project-id
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: alti-workspaces
  # e.g., us-central1-docker.pkg.dev/your-gcp-project-id/alti-workspaces

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for GCP Workload Identity Federation

    strategy:
      matrix:
        environment: [node, python, go, rust]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          service_account: 'my-service-account@your-gcp-project-id.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/workspaces/${{ matrix.environment }}
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/alti-workspace-${{ matrix.environment }}:latest
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/alti-workspace-${{ matrix.environment }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
