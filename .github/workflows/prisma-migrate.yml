name: Database Migration Pipeline

on:
  push:
    paths:
      - 'alti.code.studio.backend/prisma/**'
    branches: [main]
  pull_request:
    paths:
      - 'alti.code.studio.backend/prisma/**'

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  lint-migrations:
    name: Lint Migration Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: alti.code.studio.backend/package-lock.json
      - name: Install dependencies
        run: cd alti.code.studio.backend && npm ci --ignore-scripts
      - name: Validate Prisma schema
        run: cd alti.code.studio.backend && npx prisma validate
      - name: Check for drift
        run: |
          cd alti.code.studio.backend
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --exit-code || echo "::warning::Schema drift detected"

  diff-review:
    name: Generate Migration Diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: alti.code.studio.backend/package-lock.json
      - name: Install dependencies
        run: cd alti.code.studio.backend && npm ci --ignore-scripts
      - name: Generate diff
        run: |
          cd alti.code.studio.backend
          echo "### 📊 Prisma Migration Diff" >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --script >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No pending changes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  apply-staging:
    name: Apply to Staging
    runs-on: ubuntu-latest
    needs: [lint-migrations]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: alti.code.studio.backend/package-lock.json
      - name: Install dependencies
        run: cd alti.code.studio.backend && npm ci --ignore-scripts
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} --port 5432 &
          sleep 5
      - name: Apply migrations
        run: |
          cd alti.code.studio.backend
          npx prisma migrate deploy
      - name: Verify migration
        run: |
          cd alti.code.studio.backend
          npx prisma migrate status

  apply-production:
    name: Apply to Production
    runs-on: ubuntu-latest
    needs: [apply-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: alti.code.studio.backend/package-lock.json
      - name: Install dependencies
        run: cd alti.code.studio.backend && npm ci --ignore-scripts
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_CONNECTION_NAME_PROD }} --port 5432 &
          sleep 5
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          cd alti.code.studio.backend
          npx prisma migrate deploy
      - name: Verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: cd alti.code.studio.backend && npx prisma migrate status
