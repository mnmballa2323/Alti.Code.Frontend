name: AWS Marketplace Publisher

on:
  push:
    branches:
      - main
    paths:
      - 'marketplace/aws/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_MARKETPLACE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Validate CloudFormation Template
        run: |
          aws cloudformation validate-template \
            --template-body file://marketplace/aws/template.yaml

      - name: Publish to AWS Marketplace Catalog
        # This uses the AWS Marketplace Catalog API to update the product listing
        # with the newly validated CloudFormation template.
        run: |
          # The ProductId and Catalog configuration should be injected via variables
          echo "Starting AWS Marketplace Catalog Update API..."
          aws marketplace-catalog start-change-set \
            --catalog "AWSMarketplace" \
            --change-set '[
              {
                "ChangeType": "AddDeliveryOptions",
                "Entity": {
                  "Type": "ServerlessApplication",
                  "Identifier": "${{ secrets.AWS_MARKETPLACE_PRODUCT_ID }}"
                },
                "Details": "{\"DeliveryOptions\":[{\"Details\":{\"CloudFormationTemplateUrl\":\"https://s3.amazonaws.com/alti-marketplace/template.yaml\"}}]}"
              }
            ]'
          echo "AWS Marketplace update triggered successfully."
