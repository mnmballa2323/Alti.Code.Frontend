name: Build, Verify, and Deploy (GitOps)

on:
  push:
    branches:
      - main
    paths:
      - 'alti.code.studio.backend/**'
      - 'alti.code.studio.frontend/**'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

env:
  PROJECT_ID: alti-code-studio-production
  GAR_LOCATION: us-central1
  REPOSITORY: alti-repo
  BACKEND_IMAGE: alti-backend
  FRONTEND_IMAGE: alti-frontend
  # Set via Terraform Output
  WORKLOAD_IDENTITY_PROVIDER: 'projects/123456789/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
  SERVICE_ACCOUNT: 'github-actions-deployer@alti-code-studio-production.iam.gserviceaccount.com'

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Static Code and Dependency Security Analysis
  # ----------------------------------------------------------------------------
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Backend Dependencies
      run: |
        cd alti.code.studio.backend
        npm ci --legacy-peer-deps

    - name: Run ESLint (Static Security Check)
      run: |
        cd alti.code.studio.backend
        # Runs the newly configured eslint-plugin-security rules
        npm run lint

    - name: Audit Backend Dependencies
      run: |
        cd alti.code.studio.backend
        # Fail the build if high or critical dependencies vulnerabilities are found
        npm audit --audit-level=high

  # ----------------------------------------------------------------------------
  # Job 2: Build and Scan Container Images
  # ----------------------------------------------------------------------------
  build-and-push:
    needs: security-audit
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: 'google-github-actions/auth@v2'
      with:
        token_format: 'access_token'
        workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
        service_account: '${{ env.SERVICE_ACCOUNT }}'

    - name: Docker Auth for GAR
      id: docker-auth
      uses: 'docker/login-action@v3'
      with:
        username: 'oauth2accesstoken'
        password: '${{ steps.auth.outputs.access_token }}'
        registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

    - name: Build Local Images
      run: |
        TAG="${GITHUB_SHA::7}"
        docker build -t backend-local ./alti.code.studio.backend
        docker build -t frontend-local \
          --build-arg KEYCLOAK_CLIENT_ID=${{ secrets.KEYCLOAK_CLIENT_ID }} \
          --build-arg KEYCLOAK_CLIENT_SECRET=${{ secrets.KEYCLOAK_CLIENT_SECRET }} \
          --build-arg KEYCLOAK_ISSUER=${{ secrets.KEYCLOAK_ISSUER }} \
          ./alti.code.studio.frontend

    # Scan the backend image for OS & application package vulnerabilities
    - name: Scan Backend Image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'backend-local'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    # Scan the frontend image for OS & application package vulnerabilities
    - name: Scan Frontend Image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'frontend-local'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Tag and Push Images to Google Artifact Registry (GAR)
      run: |
        TAG="${GITHUB_SHA::7}"
        BACKEND_URI="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${BACKEND_IMAGE}:${TAG}"
        FRONTEND_URI="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_IMAGE}:${TAG}"
        
        # Tag images
        docker tag backend-local $BACKEND_URI
        docker tag frontend-local $FRONTEND_URI
        
        # Push images
        docker push $BACKEND_URI
        docker push $FRONTEND_URI

  # ----------------------------------------------------------------------------
  # Job 3: GitOps Manifest Synchronization (ArgoCD)
  # ----------------------------------------------------------------------------
  sync-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update Kustomize image tags
      run: |
        cd k8s
        echo "Image tag updated to ${GITHUB_SHA::7}"
        # kustomize edit set image backend=${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${BACKEND_IMAGE}:${GITHUB_SHA::7}
        # kustomize edit set image frontend=${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_IMAGE}:${GITHUB_SHA::7}
